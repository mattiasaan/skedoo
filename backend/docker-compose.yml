# PostgreSQL per lo sviluppo:  docker compose up -d
# Poi nel .env:  DATABASE_URL=postgresql://skedoo:skedoo@localhost:5432/skedoo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: skedoo
      POSTGRES_PASSWORD: skedoo
      POSTGRES_DB: skedoo
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:5432:5432"   # raggiungibile solo dal tuo computer
    volumes:
      - skedoo-db:/var/lib/postgresql/data
volumes:
  skedoo-db:

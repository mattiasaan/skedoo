# Conservazione dei log sul Raspberry: al massimo 30 giorni, come promette l'informativa privacy (punto 4).
# Vale per tutto il journal del sistema, compresi i log dei container di Skedoo (driver journald in compose.yaml).
#
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp journald-skedoo.conf /etc/systemd/journald.conf.d/skedoo.conf
#   sudo systemctl restart systemd-journald
#
# MaxFileSec=1day fa ruotare i file ogni giorno: senza, il journal cancella solo file interi e una voce
# potrebbe restare fino a 30 giorni oltre il limite.
[Journal]
MaxRetentionSec=30day
MaxFileSec=1day

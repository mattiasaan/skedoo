# Skedoo sul Raspberry. Guida completa: deploy/README.md
#
# Un solo file per tutte le configurazioni: i PROFILI (COMPOSE_PROFILES in .env) scelgono cosa gira qui.
#   backend  -> db (PostgreSQL), api (FastAPI), worker (bacheca ClasseViva -> OCR -> variazioni)
#   ocr-gemini -> ocr-gemini: servizio HTTP dell'OCR dei cartelloni, con l'API Gemini
#   https    -> caddy: HTTPS con certificato automatico (serve un dominio e le porte 80/443 aperte)
#   tunnel   -> cloudflared: Cloudflare Tunnel (nessuna porta da aprire sul router)
#
#   cd deploy && docker compose up -d --build

name: skedoo

x-base: &base
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: local
    options: {max-size: "10m", max-file: "3"}

# container delle nostre immagini: filesystem in sola lettura, nessuna capability di Linux
x-locked: &locked
  read_only: true
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=256m,mode=1777"]

x-backend-env: &backend-env
  TZ: Europe/Rome
  TIMEZONE: Europe/Rome
  DATA_DIR: /app/data

services:
  # ---------------------------------------------------------------- backend
  db:
    <<: *base
    profiles: [backend]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: skedoo
      POSTGRES_DB: skedoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Europe/Rome
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [db]  # rete interna: il database non ha porte né accesso a internet
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skedoo -d skedoo"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: [*base, *locked]
    profiles: [backend]
    build: ../backend
    image: skedoo-backend:latest
    environment:
      <<: *backend-env
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${API_DOMAIN}}
      # l'API è raggiungibile solo tramite caddy/cloudflared (o in locale): l'IP del client arriva da X-Forwarded-For
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      SCHEDULE_SOURCE: db
      DATABASE_URL: postgresql://skedoo:${POSTGRES_PASSWORD}@db:5432/skedoo
      # notifiche push: l'API invia le variazioni nuove ai servizi push dei browser (serve la rete "web")
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://${API_DOMAIN}}
      PUSH_QUIET_START: ${PUSH_QUIET_START:-22:00}
      PUSH_QUIET_END: ${PUSH_QUIET_END:-06:30}
    volumes:
      - app-data:/app/data:ro  # l'API legge soltanto le variazioni scritte dal worker
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"  # solo dal Raspberry stesso (proxy sull'host, prove con curl)
    networks: [db, web]
    mem_limit: 512m
    depends_on:
      db: {condition: service_healthy}
      worker: {condition: service_started}  # il worker crea per primo il volume dei dati (con i permessi giusti)
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: [*base, *locked]
    profiles: [backend]
    build: ../backend
    image: skedoo-backend:latest
    command: ["python", "-m", "scripts.bacheca_fetch.run_periodic"]
    environment:
      <<: *backend-env
      # il worker usa solo DATA_DIR: niente JWT_SECRET né database
      CLASSVIVA_USERNAME: ${CLASSVIVA_USERNAME}
      CLASSVIVA_PASSWORD: ${CLASSVIVA_PASSWORD}
      BACHECA_FETCH_INTERVAL_SECONDS: ${BACHECA_FETCH_INTERVAL_SECONDS:-900}
      BACHECA_OCR_ENABLED: ${BACHECA_OCR_ENABLED:-true}
      BACHECA_OCR_MIN_AFFIDABILITA: ${BACHECA_OCR_MIN_AFFIDABILITA:-alta}
      OCR_URL: ${OCR_URL:-http://ocr:8090}
      OCR_TOKEN: ${OCR_TOKEN}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-1800}
    volumes:
      - app-data:/app/data
    networks: [web, ocr]
    mem_limit: 512m

  # ---------------------------------------------------------------- esposizione dell'API (scegline uno)
  caddy:
    <<: *base
    profiles: [https]
    image: caddy:2.10-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    mem_limit: 256m
    depends_on: [api]

  cloudflared:
    <<: *base
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.11.1
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    read_only: true
    cap_drop: [ALL]
    networks: [web]
    mem_limit: 256m
    depends_on: [api]

  # ---------------------------------------------------------------- OCR con Gemini
  # Servizio HTTP dell'OCR (POST /ocr, GET /health): legge i ritagli dei cartelloni con l'API Gemini di
  # Google AI Studio, niente modello locale sul Pi. Serve GEMINI_API_KEY.
  # (Il vecchio profilo "ocr" con Qwen3-VL su Ollama è archiviato in history/OCR/V4-AI.)
  ocr-gemini:
    <<: [*base, *locked]
    profiles: [ocr-gemini]
    build: ../helper/OCR/V5-Gemini
    image: skedoo-ocr-gemini:latest
    environment:
      TZ: Europe/Rome
      OCR_TOKEN: ${OCR_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
    ports:
      # tutto su un Pi: 127.0.0.1 (il worker usa la rete interna "ocr", la porta non serve fuori)
      # OCR su un altro Pi: OCR_BIND=0.0.0.0 (o l'IP LAN / Tailscale del Pi), protetto da OCR_TOKEN
      - "${OCR_BIND:-127.0.0.1}:${OCR_PORT:-8090}:8090"
    networks:
      ocr:
        aliases: [ocr]                # il worker continua a usare OCR_URL=http://ocr:8090
    mem_limit: 512m

networks:
  db:
    internal: true
  web: {}
  ocr: {}

volumes:
  db-data:
  app-data:
  caddy-data:
  caddy-config:

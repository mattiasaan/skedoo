version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
  # immagini del compose: caddy e cloudflared ricevono il traffico da internet, postgres tiene i dati
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
  # servizio OCR (helper/OCR/V5-Gemini): stessa immagine base e stesse librerie HTTP del backend
  - package-ecosystem: pip
    directory: /helper/OCR/V5-Gemini
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /helper/OCR/V5-Gemini
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
